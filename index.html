:root{
  --navy:#0f1630;
  --pink:#ff2e7e;
  --yellow:#ffcf1f;
  --surface:#fff7f9;
  --card:#ffffff;
  --ink:#141a2e;
  --muted:#6b7280;
  --line:#ffe0ec;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#171224;
    --card:#241d38;
    --ink:#fff5f8;
    --muted:#c9c0d8;
    --line:#4a3a62;
  }
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit;
  text-decoration:none
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  overflow-x:clip;
  background:var(--surface)
}

.topbar{
  background:var(--yellow);
  padding:10px 12px;
  text-align:center
}

.top-pill{
  display:inline-block;
  background:#141a2e;
  color:#ffe95c;
  font-weight:800;
  letter-spacing:.06em;
  font-size:clamp(10px,2.8vw,13px);
  padding:8px 14px;
  border-radius:999px;
  max-width:100%
}

.hero{
  background:var(--navy);
  color:white;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:28px;
  padding:36px max(18px,6vw) 30px;
  position:relative;
  overflow:hidden
}

.hero:after{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  border:1px solid #ffffff22;
  border-radius:50%;
  right:-90px;
  top:-90px
}

.hero-inner{
  position:relative;
  z-index:1
}

.hero-badge{
  display:inline-flex;
  gap:8px;
  align-items:center;
  background:#ffffff14;
  border:1px solid #ffffff2a;
  padding:7px 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em
}

.hero-kicker{
  color:var(--yellow);
  font-weight:800;
  letter-spacing:.28em;
  margin:22px 0 4px;
  font-size:clamp(13px,3vw,16px)
}

.hero h1{
  font-size:clamp(38px,7vw,72px);
  line-height:.92;
  letter-spacing:-.04em;
  margin:0;
  font-weight:800
}

.hero h1 span{
  color:var(--pink)
}

.hero-bn{
  font-family:"Hind Siliguri",sans-serif;
  font-size:clamp(22px,4.5vw,34px);
  font-weight:700;
  margin:14px 0 4px
}

.hero-bn span{
  color:#ffc7dc;
  font-weight:500
}

.hero-sub{
  font-weight:700;
  line-height:1.5;
  color:#e9e7ff
}

.hero-desc{
  color:#c8c9dc;
  line-height:1.6;
  max-width:560px
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:20px 0
}

.btn-pink{
  display:inline-flex;
  gap:8px;
  align-items:center;
  background:var(--pink);
  color:white;
  border:0;
  padding:14px 20px;
  border-radius:999px;
  font-weight:800;
  box-shadow:0 10px 24px #ff2e7e55
}

.btn-ghost{
  display:inline-flex;
  align-items:center;
  border:1px solid #ffffff55;
  color:white;
  padding:14px 18px;
  border-radius:999px;
  font-weight:700
}

.city-pills{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.city-pill{
  background:#ffffff12;
  color:white;
  border:1px solid #ffffff22;
  padding:8px 12px;
  border-radius:999px;
  font-weight:700
}

.city-pill.active{
  background:var(--yellow);
  color:#141a2e;
  border-color:var(--yellow)
}

.hero-note{
  color:#aeb0c8;
  font-size:13px
}

.hero-note b{
  color:white
}

.hero-visual{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  margin:0;
  min-height:520px
}

.hero-image-wrap{
  position:relative;
  width:min(100%,380px);
  aspect-ratio:420/520;
  border-radius:999px 999px 28px 28px;
  overflow:hidden;
  box-shadow:0 24px 60px #0006;
  background:#fff7f9
}

.hero-mother{
  display:block;
  width:100%;
  height:100%;
  -o-object-fit:cover;
     object-fit:cover
}

.hero-image-label{
  position:absolute;
  left:12px;
  bottom:12px;
  background:#141a2e;
  color:white;
  font-size:12px;
  font-weight:700;
  padding:8px 11px;
  border-radius:999px
}

.hero-card-main{
  position:absolute;
  left:0;
  bottom:28px;
  background:white;
  color:#141a2e;
  border-radius:26px;
  padding:18px;
  width:min(100%,300px);
  box-shadow:0 24px 60px #0006
}

.hero-card-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 0 8px
}

.hero-card-line span{
  background:#ffe0ec;
  color:#ff2e7e;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800
}

.hero-progress,.progress{
  height:9px;
  background:#ffe6ef;
  border-radius:999px;
  overflow:hidden
}

.hero-progress div,.progress div{
  height:100%;
  background:linear-gradient(90deg,var(--pink),var(--yellow))
}

.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px
}

.mini-grid div{
  background:#fff7f9;
  border-radius:14px;
  padding:10px
}

.mini-grid small,.result-grid small{
  display:block;
  color:#888;
  font-size:11px;
  font-weight:800;
  letter-spacing:.06em
}

.mini-grid b{
  display:block;
  margin-top:4px
}

.float-chip{
  position:absolute;
  background:var(--yellow);
  color:#141a2e;
  padding:10px 13px;
  border-radius:999px;
  font-weight:800;
  box-shadow:0 10px 20px #0004
}

.chip1{
  left:0;
  top:8%
}

.chip2{
  right:0;
  top:22%;
  background:white
}

.hero-mother{
  -o-object-position:50% 30%;
     object-position:50% 30%
}

.section-head{
  max-width:820px;

.eyebrow{
  display:inline-block;
  background:#ffe0ec;

  border-radius:999px;
  font-size:12px;
  font-weight:800;

.pink{
  color:var(--pink)
}

.section-head p{
  color:var(--muted);
  line-height:1.6
}

.calc-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  padding:22px;
  box-shadow:0 18px 50px #ff2e7e14
}

.calc-top{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:18px
}

.calc-top label,.field label{
  display:block;
  font-weight:800;
  margin-bottom:8px;
  font-size:14px
}

.seg{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.seg-btn{
  border:1px solid #e6e6e6;
  background:#fff;
  border-radius:999px;
  padding:10px 13px;
  font-weight:700;
  color:#333
}

.seg-btn.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy)
}

.seg.two .seg-btn{
  flex:1
}

.small-note{
  font-size:13px;
  color:var(--muted)
}

.select-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #ddd;
  border-radius:14px;
  padding:0 12px;
  background:white
}

.select-wrap select{
  border:0;
  outline:0;
  padding:13px 0;
  flex:1;
  font-weight:700;
  background:transparent
}

.mode-label{
  font-weight:800;
  margin:20px 0 10px
}

.mode-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px
}

.mode-btn{
  border:1.5px solid #eee;
  border-radius:16px;
  padding:13px 10px;
  background:#fff;
  text-align:left;
  font-weight:800;
  line-height:1.2
}

.mode-btn small{
  display:block;
  color:#777;
  font-weight:500;
  margin-top:6px
}

.mode-btn.active{
  border-color:var(--pink);
  background:#fff0f6;
  color:#c40f5d
}

.ivf-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-top:14px;
  background:#fff7d6;
  padding:12px;
  border-radius:14px;
  font-weight:700
}

.pill-btn{
  border:1px solid #e5c200;
  background:white;
  padding:9px 12px;
  border-radius:999px;
  font-weight:800
}

.pill-btn.active{
  background:var(--yellow)
}

.inputs-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:20px 0
}

.field input[type="date"]{
  width:100%;
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px;
  font-weight:700
}

.hint{
  color:#888;
  font-weight:500
}

.example{
  font-size:12px;
  color:#888;
  margin:7px 0 0
}

.range{
  width:100%;
  accent-color:var(--pink)
}

.range-labels{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#888
}

.big-calc{
  width:100%;
  border:0;
  background:var(--pink);
  color:white;
  border-radius:16px;
  padding:18px;
  font-size:clamp(16px,3.5vw,20px);
  font-weight:800;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  box-shadow:0 12px 28px #ff2e7e44
}

.big-calc span{
  font-family:"Hind Siliguri",sans-serif
}

.calc-foot{
  text-align:center;
  color:#777;
  font-size:13px
}

.result-box{
  margin-top:22px;
  border:2px solid #ffc7dc;
  border-radius:22px;
  padding:20px;
  background:linear-gradient(180deg,#fff7f9,#fff)
}

.result-head{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start
}

.result-head h3{
  margin:5px 0 2px;
  font-size:24px
}

.edd-big{
  font-size:clamp(30px,6vw,48px);
  font-weight:800;
  color:var(--pink);
  line-height:1.05
}

.result-head p{
  color:#666
}

.result-badge{
  background:var(--navy);
  color:white;
  border-radius:18px;
  padding:16px;
  text-align:center;
  min-width:140px
}

.result-badge b{
  display:block;
  font-size:26px
}

.result-badge span{
  font-size:12px;
  color:#cbd
}

.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0
}

.progress{
  flex:1
}

.result-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.result-grid>div{
  background:white;
  border:1px solid #ffe0ec;
  padding:14px;
  border-radius:16px
}

.result-grid b{
  display:block;
  margin:5px 0 3px
}

.result-grid span{
  font-size:12px;
  color:#888
}

.milestone-table-wrap{
  margin-top:18px
}

.milestone-table-wrap h4{
  font-size:18px
}

.milestone-table-wrap h4 span{
  color:#888;
  font-size:13px
}

.table{
  border:1px solid #eee;
  border-radius:16px;
  overflow:hidden
}

.tr{
  display:grid;
  grid-template-columns:1.4fr .6fr 1fr 1.3fr;
  gap:10px;
  padding:12px 14px;
  border-bottom:1px solid #f0f0f0;
  align-items:center
}

.tr.th{
  background:#141a2e;
  color:white;
  font-weight:800
}

.week-pill{
  background:#ffe0ec;
  color:#c40f5d;
  padding:4px 9px;
  border-radius:999px;
  width:-moz-max-content;
  width:max-content;
  font-weight:800
}

.muted{
  color:#777
}

.disclaimer{
  background:#fff7d6;
  border-radius:12px;
  padding:11px 13px;
  font-size:13px;
  margin-top:12px
}

.result-preview{
  display:flex;
  gap:10px;
  align-items:center;
  background:#fff7d6;
  border-radius:14px;
  padding:13px;
  margin-top:16px
}

.size-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.size-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px
}

.size-top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.week-badge{
  background:var(--navy);
  color:white;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px
}

.size-emoji{
  font-size:42px
}

.size-card h3{
  margin:16px 0 3px;
  font-size:22px
}

.size-card>b{
  color:var(--pink)
}

.size-card p{
  color:var(--muted)
}

.link-btn{
  border:0;
  background:transparent;
  color:var(--pink);
  font-weight:800;
  margin:16px auto;
  display:block
}

.all-weeks{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.all-weeks div{
  background:var(--card);
  border:1px solid var(--line);
  padding:10px;
  border-radius:12px
}

.all-weeks b{
  display:block
}

.all-weeks span{
  font-size:13px;
  color:var(--muted)
}

.food-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.food-card{
  background:var(--card);
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--line)
}

.food-head{
  color:white;
  padding:18px
}

.food-head h3{
  margin:0
}

.food-body{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:16px
}

.food-body h4{
  margin:0 0 8px;
  font-size:14px
}

.food-body ul{
  padding-left:18px;
  margin:0;
  line-height:1.8;
  font-size:14px
}

.food-note{
  text-align:center;
  color:var(--muted);
  display:flex;
  gap:6px;
  justify-content:center;
  margin-top:14px
}

.checkup-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.check-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px
}

.check-card.mid{
  background:#fff0f6
}

.check-card.dark{
  background:var(--navy);
  color:white
}

.num{
  font-size:44px;
  font-weight:800;
  color:var(--pink);
  line-height:1
}

.check-card h3{
  margin:8px 0
}

.check-card b{
  font-size:18px
}

.tag{
  display:inline-block;
  background:#ffe0ec;
  color:#7a0a3a;
  padding:6px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-top:12px
}

.check-card.dark .tag{
  background:#ffffff22;
  color:white
}

.name-section{
  background:#fff0f6;
  border-radius:28px;
  margin:0 max(16px,5vw)
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px
}

.tab{
  border:1px solid #e5a8c1;
  background:white;
  padding:10px 16px;
  border-radius:999px;
  font-weight:800
}

.tab.active{
  background:var(--pink);
  color:white;
  border-color:var(--pink)
}

.name-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px
}

.name-card{
  background:white;
  border-radius:20px;
  padding:16px;
  text-align:center;
  position:relative
}

.name-tag{
  position:absolute;
  right:10px;
  top:10px;
  background:#fff0f6;
  color:#c40f5d;
  font-size:11px;
  padding:4px 7px;
  border-radius:999px
}

.name-big{
  font-family:"Hind Siliguri",sans-serif;
  font-size:34px;
  font-weight:700;
  color:var(--navy)
}

.name-card h3{
  margin:2px 0
}

.name-card p{
  color:#777;
  font-size:13px
}

.heart-btn{
  border:1px solid #ffc7dc;
  background:white;
  border-radius:999px;
  padding:8px 12px;
  font-weight:800
}

.heart-btn.saved{
  background:#ff2e7e;
  color:white
}

.center-note{
  text-align:center;
  color:#777;
  margin-top:14px
}

.dubai-card{
  background:var(--yellow);
  border-radius:26px;
  padding:26px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center
}

.dubai-card h2{
  font-size:clamp(26px,4.5vw,40px);
  line-height:1.05;
  margin:8px 0
}

.dubai-card h2 span{
  color:#c40f5d
}

.dubai-card ul{
  padding:0;
  list-style:none;
  line-height:1.9;
  font-weight:700
}

.dubai-badge{
  background:#141a2e;
  color:white;
  border-radius:20px;
  padding:18px;
  text-align:center;
  min-width:140px
}

.dubai-badge b{
  font-size:52px;
  color:var(--yellow);
  display:block
}

.dubai-badge span{
  letter-spacing:.2em;
  font-weight:800
}

.city-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.city-card{
  background:var(--card);
  border:1px solid var(--line);
  padding:18px;
  border-radius:20px
}

.city-card.active{
  border:2px solid var(--pink);
  background:#fff0f6
}

.city-emoji{
  font-size:28px
}

.city-card h3{
  margin:8px 0 4px
}

.city-card h3 i{
  color:var(--pink);
  font-size:13px
}

.city-card p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5
}

.small-btn{
  border:0;
  background:transparent;
  color:var(--pink);
  font-weight:800;
  padding:0
}

.projects-card{
  background:var(--navy);
  color:white;
  border-radius:28px;
  padding:24px
}

.projects-head{
  margin-bottom:16px
}

.projects-head span{
  color:var(--yellow);
  font-weight:800;
  font-size:12px;
  letter-spacing:.1em
}

.projects-head h2{
  margin:6px 0
}

.projects-head p{
  color:#b8bbd0
}

.projects-list{
  list-style:none;
  padding:0;
  margin:0
}

.projects-list li{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border-top:1px solid #ffffff1f
}

.projects-list li>span{
  background:#ffffff18;
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  font-weight:800
}

.projects-list li>div{
  flex:1
}

.projects-list p{
  margin:2px 0 0;
  color:#aab
}

.projects-list em{
  color:#aab;
  font-style:normal
}

.projects-list .here{
  background:var(--pink);
  border-radius:16px
}

.projects-list .here em{
  color:white;
  font-weight:800
}

.score{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  background:#ffffff12;
  border-radius:16px;
  padding:16px;
  margin-top:16px
}

.score b{
  display:block
}

.stars{
  color:var(--yellow);
  font-size:22px
}

.score p{
  flex-basis:100%;
  margin:0;
  color:#cbd
}

.faq-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
  align-items:start
}

.faq-list details{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px 16px;
  margin-bottom:10px
}

.faq-list summary{
  list-style:none;
  display:flex;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
  font-weight:800
}

.faq-list summary span{
  color:var(--pink)
}

.faq-list p{
  color:var(--muted);
  line-height:1.6
}

.refs-section{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:16px
}

.refs-card,.blog-card{
  border-radius:24px;
  padding:22px
}

.refs-card{
  background:var(--card);
  border:1px solid var(--line)
}

.refs-card ul{
  line-height:2
}

.blog-card{
  background:var(--navy);
  color:white
}

.live-dot{
  color:#7dffb0;
  font-weight:800;
  font-size:12px
}

.blog-card h3{
  font-size:26px;
  margin:8px 0
}

.blog-list{
  display:grid;
  gap:8px;
  margin:14px 0
}

.blog-item{
  width:100%;
  text-align:left;
  background:#ffffff12;
  border:1px solid #ffffff22;
  color:white;
  border-radius:14px;
  padding:12px
}

.blog-item.active{
  background:white;
  color:#141a2e
}

.blog-item b{
  display:block;
  margin-top:4px;
  line-height:1.35
}

.blog-date{
  display:block;
  color:#ffc7dc;
  font-size:11px;
  font-weight:800;
  letter-spacing:.05em
}

.blog-item.active .blog-date{
  color:#c40f5d
}

.blog-summary{
  color:#e9e7ff;
  line-height:1.6
}

.blog-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0
}

.blog-tags span{
  background:#ffffff1a;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px
}

.blog-card small{
  display:block;
  margin-top:12px;
  color:#aab
}

footer{
  background:var(--navy);
  color:white;
  text-align:center;
  padding:32px 16px 28px
}

.foot-logo{
  font-size:24px;
  font-weight:800
}

.foot-logo span{
  color:var(--pink)
}

.foot-disclaimer{
  display:flex;
  gap:6px;
  justify-content:center;
  color:#cbd
}

.foot-links{
  display:flex;
  gap:18px;
  justify-content:center;
  flex-wrap:wrap;
  margin:14px 0
}

.foot-links a{
  color:#ffd6e7;
  font-weight:700
}

.copy{
  color:#8f93ad;
  font-size:12px
}

.brand-strip{
  border-top:1px solid var(--line);
  background:var(--surface);
  padding:18px max(16px,5vw) 16px
}

.brand-strip-inner{
  max-width:900px;
  margin:0 auto
}

.brand-strip-title{
  margin:0;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
  font-weight:800;
  letter-spacing:.12em
}

.brand-strip-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:10px 0 8px
}

.brand-pill{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 10px
}

.brand-num{
  display:grid;
  place-items:center;
  flex:0 0 auto;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#f1f0f5;
  color:var(--muted);
  font-size:11px;
  font-weight:800
}

.brand-pill-text{
  display:flex;
  flex-direction:column;
  min-width:0
}

.brand-pill-text b{
  font-size:12px;
  line-height:1.25;
  overflow-wrap:anywhere
}

.brand-pill-text small{
  font-size:11px;
  line-height:1.3;
  color:var(--muted);
  overflow-wrap:anywhere
}

.brand-pill-text small i{
  font-style:normal;
  color:#c40f5d;
  font-weight:800
}

.brand-pill-here{
  background:#fff0f6;
  border-color:#ffc7dc
}

.brand-pill-here .brand-num{
  background:var(--pink);
  color:#fff
}

.brand-strip-more{
  margin:0;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  overflow-wrap:anywhere
}

.brand-pill-text small em{
  font-style:normal;
  color:var(--ink);
  font-weight:800
}

.brand-pill-main{
  background:#fffdf4;
  border-color:#eadfc0
}

.brand-pill-main .brand-num{
  background:var(--navy);
  color:#fff
}

@media(max-width:820px){
  .hero{
    grid-template-columns:1fr;
    padding-top:28px
  }

  .hero-visual{
    min-height:0
  }

  .hero-image-wrap{
    width:min(100%,360px)
  }

  .hero-card-main{
    bottom:18px
  }

  .float-chip{
    font-size:13px
  }

  .calc-top,.inputs-grid,.food-grid,.checkup-grid,.city-grid,.faq-grid,.refs-section{
    grid-template-columns:1fr
  }

  .mode-grid{
    grid-template-columns:1fr 1fr
  }

  .mode-grid button:last-child{
    grid-column:1/-1
  }

  .size-grid{
    grid-template-columns:1fr 1fr
  }

  .name-grid{
    grid-template-columns:1fr 1fr
  }

  .name-grid article:last-child{
    grid-column:1/-1
  }

  .all-weeks{
    grid-template-columns:1fr 1fr
  }

  .result-grid{
    grid-template-columns:1fr 1fr
  }

  .result-head{
    flex-direction:column
  }

  .result-badge{
    width:100%
  }

  .tr{
    grid-template-columns:1fr 1fr
  }

  .tr span:nth-child(4){
    grid-column:1/-1
  }

  .dubai-card{
    flex-direction:column;
    align-items:flex-start
  }

  .dubai-badge{
    width:100%
  }

  .food-body{
    grid-template-columns:1fr
  }

  .brand-strip-grid{
    grid-template-columns:1fr 1fr
  }

  .brand-pill-here{
    grid-column:1/-1
  }

  .brand-strip-grid{
    grid-template-columns:1fr 1fr
  }

  .brand-pill-here{
    grid-column:auto
  }

  .brand-pill-main{
    grid-column:1/-1
  }
}

@media(max-width:480px){
  .hero{
    padding-left:16px;
    padding-right:16px
  }

  .section{
    padding-left:14px;
    padding-right:14px
  }

  .size-grid,.result-grid,.name-grid{
    grid-template-columns:1fr
  }

  .calc-card{
    padding:14px
  }

  .mode-grid{
    grid-template-columns:1fr
  }

  .seg-btn{
    flex:1
  }

  .hero-actions .btn-pink,.hero-actions .btn-ghost{
    width:100%;
    justify-content:center
  }

  .edd-big{
    font-size:30px
  }

  .top-pill{
    font-size:10px;
    padding:7px 8px
  }

  .hero-card-main{
